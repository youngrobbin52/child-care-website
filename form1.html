<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 2: Child’s Enrollment Information</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f7f6; }
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; font-size: 24px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .submit-btn { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; font-size: 18px; margin-top: 30px; cursor: pointer; }
        .next-link { display: block; text-align: center; margin-top: 20px; color: #3498db; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
<div class="form-card">
    <h1>2. Child’s Enrollment Information</h1>
    
    <form action="https://formspree.io/f/xlgzrdnn" method="POST">
        <label>Child's Full Name</label>
        <input type="text" name="child_full_name" required>

        <label>Date of Birth</label>
        <input type="date" name="child_dob" required>

        <label>Gender</label>
        <input type="text" name="gender">

        <label>Home Address</label>
        <input type="text" name="address" required>

        <label>Date of Enrollment</label>
        <input type="date" name="enrollment_date" required>

        <button type="submit" class="submit-btn">Submit Enrollment Info</button>
    </form>
    
    <!-- This link leads to Form 3 -->
    <a href="form2.html" class="next-link">GO TO: Form 3 - Family Information →</a>
</div>
</body>
</html>
