<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 1: Mandatory Child Information Checklist</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f7f6; }
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        label { display: block; margin-top: 20px; font-weight: bold; }
        button { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; font-size: 18px; margin-top: 25px; cursor: pointer; }
        button:disabled { background: #95a5a6; }
    </style>
</head>
<body>

<div class="form-card">
    <h1>Mandatory Child Information Checklist</h1>
    <p>Please confirm you have all required info before continuing.</p>

    <form id="enroll-form">
        <label>
            <input type="checkbox" name="checklist_confirm" required style="margin-right: 10px;">
            I confirm I have all required information ready
        </label>

        <button type="submit" id="submit-btn">Continue to Form 2</button>
    </form>
</div>

<script>
    const form = document.getElementById('enroll-form');
    const button = document.getElementById('submit-btn');

    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Stop the "Thanks" page from loading
        button.disabled = true;
        button.innerText = "Saving...";

        const formData = new FormData(form);

        // Sends data to Formspree silently
        fetch("https://formspree.io/f/xgodeqzv", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).then(response => {
            // Instantly go to the next page
            window.location.href = "https://msrobbininhomechildcare.com/form2.html";
        }).catch(error => {
            // If error, still go to next page so parent isn't stuck
            window.location.href = "https://msrobbininhomechildcare.com/form2.html";
        });
    });
</script>

</body>
</html>
