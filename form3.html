<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form 3: Family Information</title>

<style>
body {
    font-family: sans-serif;
    padding: 20px;
    max-width: 600px;
    margin: auto;
    background: #f4f7f6;
}

.form-card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

h1 {
    color: #2c3e50;
    border-bottom: 2px solid #3498db;
    padding-bottom: 10px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    background: #27ae60;
    color: white;
    padding: 15px;
    border: none;
    border-radius: 5px;
    width: 100%;
    font-size: 18px;
    margin-top: 25px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="form-card">

<h1>Family Information</h1>

<form action="https://formspree.io/f/xgodeqzv" method="POST">

<!-- sends to Form 4 -->
<input type="hidden" name="_next" value="form4.html">

<label>Parent / Guardian Full Name</label>
<input type="text" name="parent_name" required>

<label>Relationship to Child</label>
<input type="text" name="relationship" required>

<label>Phone Number</label>
<input type="text" name="phone" required>

<label>Email Address</label>
<input type="email" name="email" required>

<label>Home Language</label>
<input type="text" name="language">

<label>Additional Family Notes</label>
<textarea name="family_notes" rows="4"></textarea>

<button type="submit">Continue to Form 4</button>

</form>

</div>

</body>
</html>
