<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 3: Emergency Contacts</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f7f6; }
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; font-size: 18px; margin-top: 25px; cursor: pointer; }
        button:disabled { background: #95a5a6; }
    </style>
</head>
<body>
<div class="form-card">
    <h1>Emergency Contact Information</h1>
    <form id="enroll-form">
        <label>Primary Emergency Contact Name</label>
        <input type="text" name="emergency_1_name" required>
        <label>Relationship to Child</label>
        <input type="text" name="emergency_1_rel" required>
        <label>Phone Number</label>
        <input type="tel" name="emergency_1_phone" required>

        <hr style="margin-top:20px; border: 0; border-top: 1px solid #eee;">

        <label>Secondary Emergency Contact Name</label>
        <input type="text" name="emergency_2_name">
        <label>Phone Number</label>
        <input type="tel" name="emergency_2_phone">

        <button type="submit" id="submit-btn">Continue to Form 4</button>
    </form>
</div>

<script>
    const form = document.getElementById('enroll-form');
    const button = document.getElementById('submit-btn');
    
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        button.disabled = true;
        button.innerText = "Saving...";
        
        const formData = new FormData(form);
        
        fetch("https://formspree.io/f/xgodeqzv", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        }).then(() => {
            // This line MUST match your filename on GitHub exactly
            window.location.href = "form4.html";
        }).catch(() => {
            window.location.href = "form4.html";
        });
    });
</script>
</body>
</html>
