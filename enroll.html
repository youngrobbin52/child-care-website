<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment - Page 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Child Information (Part 1)</h2>
        <!-- This line below is the fix with your real ID -->
        <form action="https://formspree.io/f/xgodeqzv" method="POST">
            
            <label for="child-name">Child's First & Last Name:</label>
            <input type="text" id="child-name" name="child_name" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>

            <label for="start-date">Desired Start Date:</label>
            <input type="date" id="start-date" name="start_date" required>

            <label for="parent-email">Parent Email Address (For Confirmation):</label>
            <input type="email" id="parent-email" name="email" required>

            <!-- This tells Formspree where to send the parent AFTER they hit Next -->
            <input type="hidden" name="_next" value="https://msrobbininhomechildcare.com/page2.html">
            
            <button type="submit">Next Page</button>
        </form>
    </div>
</body>
</html>
