<title>Form 9: Social Media Policy</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f7f6; }
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        label { display: block; margin-top: 20px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; font-size: 18px; margin-top: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-card">
    <h1>Social Media Policy</h1>
    <p>Please select your privacy preferences regarding photos or updates of your child for childcare communication.</p>
    
    <form action="https://formspree.io/f/xgodeqzv" method="POST">
        <input type="hidden" name="_next" value="https://msrobbininhomechildcare.com/form10.html">

        <label style="margin-top: 20px;">Permission Level:</label>
        <div style="margin-top: 10px;">
            <input type="radio" id="sm_yes" name="social_media_permission" value="Yes" checked>
            <label style="display:inline; font-weight:normal;" for="sm_yes">I ALLOW photos/videos of my child in childcare group updates.</label>
        </div>
        <div style="margin-top: 10px;">
            <input type="radio" id="sm_no" name="social_media_permission" value="No">
            <label style="display:inline; font-weight:normal;" for="sm_no">I DO NOT WANT any photos/videos of my child shared.</label>
        </div>

        <label>Parent/Guardian Digital Signature</label>
        <input type="text" name="signature_form9" required placeholder="Type full name">

        <button type="submit">Continue to Form 10</button>
    </form>
</div>

</body>
</html>
