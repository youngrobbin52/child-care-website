<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form 7: Medical Contraindication</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f7f6; }
        .form-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        label { display: block; margin-top: 20px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; width: 100%; font-size: 18px; margin-top: 25px; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-card">
    <h1>Medical Contraindication for Immunizations</h1>
    <p>Complete this section <em>only</em> if your child has a medical exemption from a physician stating an immunization cannot be given.</p>
    
    <form action="https://formspree.io/f/xgodeqzv" method="POST">
        <input type="hidden" name="_next" value="https://msrobbininhomechildcare.com/form8.html">

        <label>Exempted Vaccine(s)</label>
        <input type="text" name="medical_exempt_vaccines" placeholder="Type N/A if not applicable">

        <label>Physician Name (If applicable)</label>
        <input type="text" name="exempt_physician">

        <label>Digital Signature / Acknowledgement</label>
        <input type="text" name="signature_form7" required placeholder="Type full name">

        <button type="submit">Continue to Form 8</button>
    </form>
</div>

</body>
</html>
