<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enrollment - Page 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2>Parent/Guardian Information (Part 3)</h2>
        
        <!-- This sends the data to your email -->
        <form action="https://formspree.io/f/xgodeqzv" method="POST">
            
            <!-- Example Questions - You can change these to whatever you need for Page 3 -->
            <label for="parent-name">Parent/Guardian Full Name:</label>
            <input type="text" id="parent-name" name="parent_full_name" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone_number" required>

            <label for="address">Home Address:</label>
            <input type="text" id="address" name="address" required>

            <!-- IMPORTANT: This tells the form to go to Page 4 next -->
            <input type="hidden" name="_next" value="https://msrobbininhomechildcare.com/page4.html">
            
            <div class="button-group">
                <button type="submit">Next Page</button>
            </div>
        </form>
    </div>
</body>
</html>
