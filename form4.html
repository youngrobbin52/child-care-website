<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form 4: Emergency Treatment Authorization</title>

<style>
body {
    font-family: sans-serif;
    padding: 20px;
    max-width: 600px;
    margin: auto;
    background: #f4f7f6;
}

.form-card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

h1 {
    color: #2c3e50;
    border-bottom: 2px solid #3498db;
    padding-bottom: 10px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    background: #27ae60;
    color: white;
    padding: 15px;
    border: none;
    border-radius: 5px;
    width: 100%;
    font-size: 18px;
    margin-top: 25px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="form-card">

<h1>Emergency Treatment Authorization</h1>

<p>Please complete emergency contact and medical authorization information.</p>

<form action="https://formspree.io/f/xlgzrdnn" method="POST">

<!-- sends to Form 5 -->
<input type="hidden" name="_next" value="form5.html">

<label>Emergency Contact Full Name</label>
<input type="text" name="emergency_contact_name" required>

<label>Relationship to Child</label>
<input type="text" name="emergency_relationship" required>

<label>Emergency Phone Number</label>
<input type="text" name="emergency_phone" required>

<label>Authorized Hospital / Doctor</label>
<input type="text" name="doctor_info">

<label>Medical Conditions / Allergies</label>
<textarea name="medical_conditions" rows="4"></textarea>

<label>
<input type="checkbox" name="consent" required>
I authorize emergency medical treatment if necessary
</label>

<button type="submit">Continue to Form 5</button>

</form>

</div>

</body>
</html>
