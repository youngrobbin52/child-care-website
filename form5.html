<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form 5: Universal Child Health Record (UCHR)</title>

<style>
body {
    font-family: sans-serif;
    padding: 20px;
    max-width: 600px;
    margin: auto;
    background: #f4f7f6;
}

.form-card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

h1 {
    color: #2c3e50;
    border-bottom: 2px solid #3498db;
    padding-bottom: 10px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    background: #27ae60;
    color: white;
    padding: 15px;
    border: none;
    border-radius: 5px;
    width: 100%;
    font-size: 18px;
    margin-top: 25px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="form-card">

<h1>Universal Child Health Record (UCHR)</h1>

<p>Please provide required health information for your child.</p>

<form action="https://formspree.io/f/xgodeqzv" method="POST">

<!-- sends to Form 6 -->
<input type="hidden" name="_next" value="form6.html">

<label>Child's Name</label>
<input type="text" name="child_name" required>

<label>Date of Birth</label>
<input type="date" name="dob" required>

<label>Physician Name</label>
<input type="text" name="physician">

<label>Physician Phone Number</label>
<input type="text" name="physician_phone">

<label>Allergies</label>
<textarea name="allergies" rows="3"></textarea>

<label>Medications</label>
<textarea name="medications" rows="3"></textarea>

<label>Medical Conditions</label>
<textarea name="conditions" rows="4"></textarea>

<button type="submit">Continue to Form 6</button>

</form>

</div>

</body>
</html>
